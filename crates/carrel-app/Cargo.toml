[package]
name = "carrel-app"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Carrel contributors"]
description = "A local-first reader for the open web"
build = "build.rs"

[lib]
name = "carrel_app"
path = "src/lib.rs"

[dependencies]
blake3 = { workspace = true }
cozo = { workspace = true }
carrel-core = { workspace = true }
carrel-feeds = { workspace = true }
carrel-store = { workspace = true }
carrel-sync = { workspace = true }
html-escape = { workspace = true }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22.1"
kuchiki = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# deep-link 2.6.2 constructs ParseOption without defaults; 0.21.3 added fields.
# Remove this compatibility bound after a release containing upstream fix #3711.
rust-ini = "=0.21.1"

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
iroh = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
