<script>
(() => {
  const root = document.getElementById('carrel-reading-proposal');

  const articles = [
    {id:'useful', source:'Field Notes', author:'Mira Ellis', date:'9 October', title:'The quiet pleasure of a useful thing', summary:'On objects that earn their place by making a small part of daily life easier.', paragraphs:[
      'A good tool does not need to announce itself. It waits on the shelf, or in a drawer, until something needs doing. Its value becomes apparent in the doing: a clean cut, a comfortable grip, a page that stays open exactly where you left it.',
      'There is a kind of beauty in this restraint. We often look for beauty in the exceptional object, the one that refuses to resemble anything else. But the ordinary thing can be just as considered. Its proportions hold a memory of the hand. Its smallest decisions remove a little friction from the day.',
      'The things I return to are seldom the most elaborate. They leave room for my own habits. Over time, a useful object becomes familiar without becoming invisible; it remains a quiet invitation to pay attention to the work itself.'
    ]},
    {id:'margin', source:'Margins', author:'Daniel Venn', date:'9 October', title:'A margin is a place to think', summary:'What the empty edge of a page makes possible.', paragraphs:[
      'The margin begins where the sentence ends. It belongs to the page, but it leaves the reader enough room to disagree. A pencil mark, a question, a short connection to something read last week: each is a way of keeping the conversation open.',
      'I have come to think of the empty edge as part of the writing rather than a space around it. Without that pause, even a generous argument can feel closed. The eye needs somewhere to rest, and the mind needs time to make a thought its own.',

    {id:'walk', source:'The Common Reader', author:'Nora Vale', date:'8 October', title:'Walking the long way home', summary:'A familiar route, taken slowly enough to become unfamiliar again.', paragraphs:[
      'At the corner I turned left instead of right. The difference was only a few streets, but it changed the afternoon. The shops faced the sun differently. A garden I had never noticed was full of pale leaves.',
      'A route can become so familiar that we stop seeing the places it connects. We remember the turns, not the trees. Walking the long way gave the neighborhood back its particularity: the low wall, the narrow gate, the sound of someone washing dishes behind an open window.',
      'I arrived home with nothing to report. The walk had supplied no revelation and completed no task. It had simply returned a little detail to a place I thought I knew.'
    ]},
    {id:'repair', source:'Field Notes', author:'Mira Ellis', date:'8 October', title:'In praise of the repair', summary:'Keeping an object means learning to see how it is put together.', paragraphs:[

      'Repair changes our relationship with an object. A surface becomes a set of parts. We begin to see what carries the weight and what merely covers the work. This knowledge is modest, but it makes ownership feel less abstract.',

      stars: Array.isArray(restore?.stars) ? restore.stars : ['margin'],
      sources: Array.isArray(restore?.sources) ? restore.sources.filter(source=>typeof source==='string').slice(0,12).map(source=>source.slice(0,80)) : [...initialSources],
      passages: Array.isArray(restore?.passages) ? restore.passages.slice(0,12) : [{id:'saved-margin',article:'margin',quote:'The eye needs somewhere to rest, and the mind needs time to make a thought its own.',note:'Leave room for the reader.'}],
      queue: Array.isArray(restore?.queue) ? restore.queue.filter(id=>articles.some(article=>article.id===id)) : [], note: null, theme:'auto'
    };
    const design = {readingSize:20, measure:62, rowSpace: variantIndex ? 20 : 23};
    const status = text => { message.textContent = text; };
    const item = id => articles.find(article => article.id === id);
    const label = () => state.source || state.nav;
    function visibleArticles() {
      return articles.filter(article => {
        if (state.source) return article.source === state.source;
        if (state.nav === 'Reading') return state.started.includes(article.id) && !state.read.includes(article.id);
        if (state.nav === 'Library' && state.filter === 'Unread') return !state.read.includes(article.id);
        if (state.nav === 'Library' && state.filter === 'Starred') return state.stars.includes(article.id);
        return true;
      });
    }
    function icons() {
      windowElement.querySelectorAll('button').forEach(button=>button.classList.add('cursor-interaction'));
      globalThis.lucide?.createIcons({attrs:{width:16,height:16}});
    }
    function renderDesign() {
      windowElement.style.setProperty('--carrel-reading-size', `${design.readingSize}px`);
      windowElement.style.setProperty('--carrel-reading-measure', `${design.measure}ch`);
      windowElement.style.setProperty('--carrel-row-space', `${design.rowSpace}px`);
    }
    function renderFeeds() {
      feeds.innerHTML = state.sources.map(source => `<button type="button" data-source="${escape(source)}"${state.source === source ? ' aria-current="page"' : ''}>${escape(source)}</button>`).join('');
      windowElement.querySelectorAll('[data-nav]').forEach(button => {
        if (!state.source && button.dataset.nav === state.nav) button.setAttribute('aria-current','page');
        else button.removeAttribute('aria-current');
      });
    }
    function passageMarkup(passage, openControl) {
      const article = item(passage.article);
      if (!article) return '';
      return `<div class="carrel-passage"><blockquote>${escape(passage.quote)}</blockquote>${passage.note ? `<p>${escape(passage.note)}</p>` : ''}${openControl ? `<button type="button" data-action="open" data-id="${article.id}">${escape(article.title)} <i data-lucide="arrow-up-right" aria-hidden="true"></i></button>` : ''}</div>`;
    }
    function renderList() {
      windowElement.classList.remove('is-reading');
      renderFeeds();
      const list = visibleArticles();
      if (!list.some(article => article.id === state.selected)) state.selected = list[0]?.id || null;
      const heading = label();
      const subtitle = state.nav === 'Highlights' && !state.source ? 'Saved passages' : state.nav === 'Reading' && !state.source ? 'Where you left off' : state.nav === 'Today' && !state.source ? 'Recent arrivals · past 24 hours' : 'Your reading archive';
      main.innerHTML = `<div class="carrel-topline"><span>Reading desk</span><span>Friday, 9 October</span></div><h1 class="carrel-heading">${escape(heading)}</h1>${state.nav === 'Library' && !state.source ? `<div class="carrel-filters" aria-label="Library filters">${['All','Unread','Starred'].map(filter => `<button type="button" data-filter="${filter}" aria-pressed="${filter === state.filter}">${filter}</button>`).join('')}</div>` : ''}<div class="carrel-list-label"><span>${subtitle}</span></div>${state.nav === 'Highlights' && !state.source ? `<div class="carrel-passages">${state.passages.map(passage => passageMarkup(passage,true)).join('') || '<p class="carrel-empty">Your saved passages belong here.</p>'}</div>` : list.length ? `<ul class="carrel-articles">${list.map(article => `<li class="carrel-item${article.id === state.selected ? ' selected' : ''}" data-item="${article.id}"><div class="carrel-item-top"><span class="carrel-item-source">${escape(article.source)}</span><span>${article.date}</span></div><button type="button" class="carrel-item-title" data-action="open" data-id="${article.id}">${escape(article.title)}</button><p class="carrel-item-summary">${escape(article.summary)}</p><button type="button" class="carrel-item-star" data-action="star" data-id="${article.id}" aria-label="${state.stars.includes(article.id) ? 'Unstar' : 'Star'} ${escape(article.title)}" aria-pressed="${state.stars.includes(article.id)}"><i data-lucide="star" aria-hidden="true"></i></button><p class="carrel-item-state">${state.read.includes(article.id) ? 'Read' : state.started.includes(article.id) ? 'In progress' : 'Unread'}</p></li>`).join('')}</ul><div class="carrel-shortcuts"><span><kbd>j k</kbd>move</span><span><kbd>Enter</kbd>open</span><span><kbd>s</kbd>star</span><span><kbd>m</kbd>mark read</span></div>` : '<p class="carrel-empty">Nothing here for now.</p>'}`;
      icons();
    }
    function renderReader() {
      const article = item(state.reading);
      if (!article) return returnToList();
      windowElement.classList.add('is-reading');
      const position = state.queue.indexOf(article.id);
      const isRead = state.read.includes(article.id);
      main.innerHTML = `<div class="carrel-reader-rail"><button type="button" class="carrel-reader-back" data-action="back"><i data-lucide="arrow-left" aria-hidden="true"></i>${escape(label())}</button><div class="carrel-reader-controls"><button type="button" data-action="previous"${position <= 0 ? ' disabled' : ''}>Previous</button><button type="button" data-action="next"${position >= state.queue.length - 1 ? ' disabled' : ''}>Next</button><button type="button" data-action="star" data-id="${article.id}" aria-pressed="${state.stars.includes(article.id)}">${state.stars.includes(article.id) ? 'Starred' : 'Star'}</button><button type="button" data-action="read" data-id="${article.id}">${isRead ? 'Mark unread' : 'Mark read'}</button></div></div><article class="carrel-reader"><div class="carrel-reader-source">${escape(article.source)}</div><h1>${escape(article.title)}</h1><p class="carrel-reader-byline">${escape(article.author)} · ${article.date}</p><div class="carrel-reader-prose">${article.paragraphs.map(paragraph => `<p>${escape(paragraph)}</p>`).join('')}</div><div class="carrel-annotation-tools"><button type="button" data-action="highlight">Highlight selection <kbd>h</kbd></button><button type="button" data-action="highlight-note">Highlight & note <kbd>H</kbd></button></div><div class="carrel-passages">${state.passages.filter(passage => passage.article === article.id).map(passage => passageMarkup(passage,false)).join('')}</div>${state.note ? `<form class="carrel-note-editor"><label>Note<textarea name="note" rows="2" placeholder="What would you like to remember?"></textarea></label><div><button type="submit" class="carrel-strong">Save note</button><button type="button" data-action="cancel-note">Cancel</button></div></form>` : ''}<div class="carrel-reader-bottom"><button type="button" class="carrel-strong" data-action="finish">${position < state.queue.length - 1 ? 'Mark read & next' : 'Mark read & return'} <kbd>n</kbd></button><button type="button" data-action="back">Return to ${escape(label())} <kbd>Esc</kbd></button></div></article>`;
      icons();
    }
    function render() {
      const active = document.activeElement;
      const action = main.contains(active) ? active?.dataset.action : null;
      const id = active?.dataset.id;
      state.reading ? renderReader() : renderList(); renderDesign();
      if (action) main.querySelector(`[data-action="${action}"]${id ? `[data-id="${id}"]` : ''}`)?.focus({preventScroll:true});
    }
    function focusSelected() { main.querySelector(`[data-action="open"][data-id="${state.selected}"]`)?.focus({preventScroll:true}); }
    function returnToList() { state.reading = null; state.note = null; renderList(); focusSelected(); }
    function open(id, keepQueue = false) {
      if (!item(id)) return;
      if (!keepQueue) state.queue = state.nav === 'Highlights' ? [...new Set(state.passages.map(passage => passage.article))] : visibleArticles().map(article => article.id);
      if (!state.queue.includes(id)) state.queue.push(id);
      state.reading = id; state.selected = id; state.note = null;
      if (!state.started.includes(id)) state.started.push(id);
      status(''); renderReader(); main.querySelector('[data-action="back"]').focus({preventScroll:true});
    }
    function adjacent(direction) {
      const id = state.queue[state.queue.indexOf(state.reading) + direction];
      if (id) open(id,true);
    }
    function toggleStar(id) {
      if (!item(id)) return;
      state.stars = state.stars.includes(id) ? state.stars.filter(value => value !== id) : [...state.stars,id];
      status(state.stars.includes(id) ? 'Starred.' : 'Star removed.'); render();
    }
    function markRead(id, read) {
      if (!item(id)) return;
      state.read = read ? [...new Set([...state.read,id])] : state.read.filter(value => value !== id);
      status(read ? 'Marked read.' : 'Marked unread.');
    }
    function finish() {
      markRead(state.reading,true);
      const next = state.queue[state.queue.indexOf(state.reading) + 1];
      if (next) open(next,true); else {returnToList(); status('Marked read. Returned to your list.');}
    }
    function highlight(withNote) {
      const selection = globalThis.getSelection?.();
      const prose = main.querySelector('.carrel-reader-prose');
      const quote = selection?.toString().trim();
      if (!quote || !prose?.contains(selection.anchorNode) || !prose.contains(selection.focusNode)) return status('Select a passage in the article first.');
      const passage = {id:`passage-${Date.now()}`,article:state.reading,quote:quote.slice(0,1500),note:''};
      state.passages.push(passage); state.note = withNote ? passage.id : null;
      selection.removeAllRanges(); renderReader(); status('Passage saved to Highlights.');
      if (withNote) main.querySelector('textarea').focus({preventScroll:true});
    }
    windowElement.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || !windowElement.contains(button) || button.disabled) return;
      if (button.dataset.nav) {state.nav=button.dataset.nav; state.source=null; state.reading=null; status(''); render();}
      else if (button.dataset.source) {state.source=button.dataset.source; state.reading=null; status(''); render();}
      else if (button.dataset.filter) {state.filter=button.dataset.filter; render();}
      else if (button.dataset.theme) {state.theme=button.dataset.theme; windowElement.style.colorScheme=state.theme==='auto'?'inherit':state.theme; windowElement.querySelector('.carrel-appearance').hidden=true;}
      else {
        const action=button.dataset.action;
        if (action==='open') open(button.dataset.id);
        else if (action==='back') returnToList();
        else if (action==='next') adjacent(1);
        else if (action==='previous') adjacent(-1);
        else if (action==='star') toggleStar(button.dataset.id);
        else if (action==='read') {markRead(button.dataset.id,!state.read.includes(button.dataset.id)); render();}
        else if (action==='finish') finish();
        else if (action==='highlight') highlight(false);
        else if (action==='highlight-note') highlight(true);
        else if (action==='cancel-note') {state.note=null; render();}
        else if (action==='appearance') {const panel=windowElement.querySelector('.carrel-appearance'); panel.hidden=!panel.hidden;}
        else if (action==='add-feed') {overlay.hidden=false; form.querySelector('[name="url"]').focus({preventScroll:true});}
        else if (action==='cancel-feed') {overlay.hidden=true; windowElement.querySelector('[data-action="add-feed"]').focus({preventScroll:true});}
      }
      persist();
    });
    windowElement.addEventListener('submit', event => {
      event.preventDefault();
      if (event.target===form) {
        const name=form.querySelector('[name="name"]').value.trim().slice(0,80);
        if (!name) return;
        if (!state.sources.includes(name)) state.sources.push(name);
        state.source=name; state.reading=null; overlay.hidden=true; form.reset(); render(); status('Subscription added.');
      } else if (event.target.matches('.carrel-note-editor')) {
        const passage=state.passages.find(value=>value.id===state.note);
        if (passage) passage.note=event.target.querySelector('[name="note"]').value.trim();
        state.note=null; render(); status('Note saved.');
      }
      persist();
    });
    windowElement.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.key==='Escape' && !overlay.hidden) {event.preventDefault(); overlay.hidden=true; windowElement.querySelector('[data-action="add-feed"]').focus({preventScroll:true}); return;}
      if (event.target.matches('input,textarea,select') || !overlay.hidden) return;
      const key=event.key;
      if (state.reading) {
        if (key==='Escape' || key==='q') returnToList();
        else if (key==='n') finish();
        else if (key==='p') adjacent(-1);
        else if (key==='s') toggleStar(state.reading);
        else if (key==='m' || key==='M') {markRead(state.reading,key==='m'); render();}
        else if (key==='h' || key==='H') highlight(key==='H');
        else return;
      } else {
        const list=visibleArticles();
        const position=list.findIndex(article=>article.id===state.selected);
        if (key==='j' || key==='k') {state.selected=list[Math.max(0,Math.min(list.length-1,position+(key==='j'?1:-1)))]?.id || null; renderList(); focusSelected();}
        else if (key==='o') open(state.selected);
        else if (key==='s') toggleStar(state.selected);
        else if (key==='m' || key==='M') {markRead(state.selected,key==='m'); renderList(); focusSelected();}
        else return;
      }
      event.preventDefault(); persist();
    });
    render();
    controllers.push({state,render});
    if (globalThis.Tweak) {
      const tweak=new Tweak({container:windowElement,onChange:renderDesign});
      tweak.addSlider(design,'readingSize',{label:'Reading size',min:18,max:24,unit:'px',reference:'--carrel-reading-size'});
      tweak.addSlider(design,'measure',{label:'Reading measure',min:48,max:70,unit:'ch',reference:'--carrel-reading-measure'});
      tweak.addSlider(design,'rowSpace',{label:'List spacing',min:14,max:30,unit:'px',reference:'--carrel-row-space'});
    }
  });
  function persist() {
    if (!globalThis.openai?.setWidgetState) return;
    const variants=controllers.map(({state})=>({nav:state.nav,source:state.source,filter:state.filter,selected:state.selected,reading:state.reading,queue:state.queue,read:state.read,started:state.started,stars:state.stars,sources:state.sources.slice(0,12),passages:state.passages.slice(-2).map(passage=>({...passage,quote:passage.quote.slice(0,450),note:passage.note.slice(0,200)}))}));
    globalThis.openai.setWidgetState({modelContent:{proposal:'Carrel reading loop',layouts:['Editorial','Index']},privateContent:{version:1,variants}}).catch(()=>{});
  }
  globalThis.addEventListener('openai:set_globals', event=>{
    const incoming=event.detail?.globals?.widgetState?.privateContent;
    if (incoming?.version!==1) return;
    controllers.forEach(({state,render},index)=>{
      const restored=incoming.variants?.[index];
      if (!restored) return;
      if (['Today','Reading','Library','Highlights'].includes(restored.nav)) state.nav=restored.nav;
      if (['All','Unread','Starred'].includes(restored.filter)) state.filter=restored.filter;
      if (typeof restored.source==='string' || restored.source===null) state.source=restored.source;
      if (articles.some(article=>article.id===restored.selected)) state.selected=restored.selected;
      state.reading=articles.some(article=>article.id===restored.reading) ? restored.reading : null;
      if (Array.isArray(restored.queue)) state.queue=restored.queue.filter(id=>articles.some(article=>article.id===id));
      if (Array.isArray(restored.read)) state.read=restored.read.filter(id=>articles.some(article=>article.id===id));
      if (Array.isArray(restored.started)) state.started=restored.started.filter(id=>articles.some(article=>article.id===id));
      if (Array.isArray(restored.stars)) state.stars=restored.stars.filter(id=>articles.some(article=>article.id===id));
      if (Array.isArray(restored.sources)) state.sources=restored.sources.filter(source=>typeof source==='string').slice(0,12).map(source=>source.slice(0,80));
      if (Array.isArray(restored.passages)) state.passages=restored.passages.slice(0,12);
      render();
    });
  });
})();
</script>
