  }
  @container (max-width: 420px) {
    #carrel-directions .article-row, #carrel-directions .field .article-row { grid-template-columns: minmax(0,1fr) 34px; }
    #carrel-directions .date { grid-column: 1; flex-direction: row; align-items: baseline; gap: 5px; }
    #carrel-directions .date-day, #carrel-directions .field .date-day { font-size: 16px; letter-spacing: 0; }
    #carrel-directions .date-month, #carrel-directions .date-year { margin-top: 0; }
    #carrel-directions .article-copy { grid-column: 1; }
    #carrel-directions .row-actions { grid-column: 2; grid-row: 1 / span 2; }
    #carrel-directions .field .topbar .destination { font-size: 12px !important; letter-spacing: -.3px; }
    #carrel-directions .field .topbar .destination[aria-current="page"] { font-size: 16px !important; }
    #carrel-directions > section { min-height: 1390px; }
    #carrel-directions .carrel-preview { min-height: 1360px; }
  }
  @media (pointer: coarse) {
    #carrel-directions .icon-button, #carrel-directions .source, #carrel-directions .destination, #carrel-directions .filter { min-height: 44px !important; }
    #carrel-directions .icon-button { min-width: 44px; }
    #carrel-directions .search-line input { font-size: 16px; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('carrel-directions');
  const posts = [
    { id: 'history', source: 'json.blog', date: '2026-09-09', title: 'The End of History and the Final Girl is another absolute banger…', excerpt: 'Katherine Alejandra Cross is fast becoming my favorite writer. If you are at all interested in this political moment, this one is worth your time.', body: ['The End of History and the Final Girl is another absolute banger by Katherine Alejandra Cross who is fast becoming my favorite writer.', 'If you are at all interested in this political moment, this one is worth your time. I couldn’t put it down.'], read: false, starred: false, reading: true },
    { id: 'ted', source: 'json.blog', date: '2026-09-09', title: 'This episode of Ted Lasso was on its way to being my favorite…', excerpt: 'Until they drop my absolute least favorite trope.', body: ['This episode of Ted Lasso was on its way to being my favorite until they drop my absolute least favorite trope.'], read: false, starred: false, reading: false },
    { id: 'phone', source: 'json.blog', date: '2026-09-09', title: 'I don’t know which phone I want', excerpt: 'Or what I want to do now that the Upgrade program is over.', body: ['I don’t know which phone I want or what I want to do now that the Upgrade program is over.'], read: false, starred: true, reading: false }
  ];
  const destinations = ['Today', 'Reading', 'Library', 'Highlights'];
  const icons = { Today: 'calendar-days', Reading: 'book-open', Library: 'library', Highlights: 'highlighter' };
  const models = new Map();
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (action, name, label, extra = '') => `<button type="button" class="icon-button cursor-interaction ${action === 'star' ? 'star' : ''}" data-action="${action}" aria-label="${esc(label)}" data-tooltip="${esc(label)}" ${extra}>${icon(name)}</button>`;
  const brand = `<div class="brand"><span class="nook" aria-hidden="true"></span><span class="wordmark">carrel</span></div>`;

  function navigation(model) {
    return `<nav class="destinations" aria-label="Destinations">${destinations.map(name => `<button type="button" class="destination cursor-interaction" data-destination="${name}" ${model.destination === name ? 'aria-current="page"' : ''}>${icon(icons[name])}<span>${name}</span></button>`).join('')}</nav>`;
  }
  function sources(model) {
    return `<aside class="source-index" aria-label="Source index" ${!model.sidebar ? 'hidden' : ''}>
      ${model.design === 'fold' ? `<div class="rail-brand">${brand}</div>${navigation(model)}` : ''}
      <div class="source-heading"><span class="source-label">Sources</span>${button('add', 'plus', 'Add a website or feed')}</div>
      <button type="button" class="source cursor-interaction" data-source="all" aria-pressed="${model.source === 'all'}">All sources</button>
      <button type="button" class="source cursor-interaction" data-source="json.blog" aria-pressed="${model.source === 'json.blog'}">json.blog</button>
      <button type="button" class="source cursor-interaction" data-source="Elixir Blog" aria-pressed="${model.source === 'Elixir Blog'}">Elixir Blog</button>
      <div class="utilities">
        <button type="button" class="utility cursor-interaction" data-action="devices">${icon('monitor')}Devices</button>
        <button type="button" class="utility cursor-interaction" data-action="subscriptions">${icon('settings-2')}Subscriptions</button>
      </div>
    </aside>`;
  }
  function list(model) {
    let items = model.posts.filter(p => model.source === 'all' || p.source === model.source);
    if (model.destination === 'Today') items = [];
    if (model.destination === 'Reading') items = items.filter(p => p.reading && !p.read);
    if (model.destination === 'Highlights') items = [];
    if (model.filter === 'Unread') items = items.filter(p => !p.read);
    if (model.filter === 'Starred') items = items.filter(p => p.starred);
    const query = model.query.toLowerCase().trim();
    if (query) items = items.filter(p => `${p.title} ${p.body.join(' ')}`.toLowerCase().includes(query));
    if (!items.length) {
      const title = query ? 'No matching posts.' : model.destination === 'Today' ? 'Nothing published in the past 24 hours.' : model.destination === 'Highlights' ? 'A place for what you notice.' : model.destination === 'Reading' ? 'Nothing left open.' : 'No posts in this view.';
      const copy = query ? 'Try another word or clear the search.' : model.destination === 'Highlights' ? 'Passages you highlight while reading will appear here.' : model.destination === 'Reading' ? 'Articles you start reading will be here when you return.' : 'Older posts remain in your Library.';
      return `<div class="empty"><h2>${title}</h2><p>${copy}</p><button type="button" class="cursor-interaction" data-action="library">Browse Library →</button></div>`;
    }
    return items.map((p,index) => `<article class="article-row ${model.selected === p.id ? 'is-selected' : ''} ${p.read ? 'is-read' : ''}" aria-label="${esc(p.title)}">
      <time class="date ${items[index - 1]?.date === p.date ? 'is-repeat' : ''}" datetime="${p.date}" aria-label="Published 9 September 2026"><span class="date-day">09</span><span class="date-month">SEP</span><span class="date-year">2026</span><span class="date-repeat">9 SEP</span></time>
      <div class="article-copy"><div class="byline"><span class="state-dot" aria-label="${p.read ? 'Read' : 'Unread'}"></span><span>${p.source}</span><span>·</span><span>1 min</span>${model.design === 'fold' ? `<span>·</span><time datetime="${p.date}">9 Sep 2026</time>` : ''}</div>
      <button type="button" class="article-title cursor-interaction" data-open="${p.id}">${esc(p.title)}</button><p class="excerpt">${esc(p.excerpt)}</p></div>
      <div class="row-actions">${button('read', p.read ? 'circle-dot' : 'circle-check', p.read ? 'Mark unread' : 'Mark read', `data-id="${p.id}" aria-pressed="${p.read}"`)}${button('star', 'star', p.starred ? 'Unstar' : 'Star', `data-id="${p.id}" aria-pressed="${p.starred}"`)}</div>
    </article>`).join('') + `<div class="list-end"><span>September 2026</span><button type="button" class="older cursor-interaction" data-action="older">Load older ${icon('arrow-down')}</button></div>`;
  }
  function overview(model) {
    const title = model.source !== 'all' ? model.source : model.destination;
    const subtitle = model.destination === 'Today' ? 'Published in the past 24 hours' : model.destination === 'Reading' ? 'Pick up where you left off' : model.destination === 'Highlights' ? 'Your passages and marginalia' : 'Your reading, kept here';
    return `<main class="page"><header class="page-heading"><h1>${esc(title)}</h1><span class="source-label">${model.destination === 'Today' ? '11 OCT 2026' : 'Archive'}</span></header><p class="page-subtitle">${subtitle}</p>
      <label class="search-line">${icon('search')}<input type="search" aria-label="Search ${esc(title)}" placeholder="Search this ${model.destination === 'Library' ? 'library' : 'view'}" value="${esc(model.query)}"></label>
      <div class="filters" ${model.destination !== 'Library' ? 'hidden' : ''}>${['All', 'Unread', 'Starred'].map(name => `<button type="button" class="filter cursor-interaction" data-filter="${name}" aria-pressed="${model.filter === name}">${name}</button>`).join('')}</div>
      <div class="items" aria-live="polite">${list(model)}</div></main>`;
  }
  function reader(model) {
    const post = model.posts.find(p => p.id === model.open);
    return `<main class="page"><div class="reader-tools"><button type="button" class="back cursor-interaction" data-action="back">${icon('arrow-left')}Back to ${model.destination}</button><div class="reader-actions">${button('sidebar', 'panel-left', 'Show or hide sources · ⌘B', `aria-pressed="${model.sidebar}"`)}${button('star','star',post.starred ? 'Unstar' : 'Star',`data-id="${post.id}" aria-pressed="${post.starred}"`)}</div></div>
      <article class="reading-page"><div class="reader-meta">${post.source} &nbsp; / &nbsp; Published 9 September 2026 &nbsp; / &nbsp; 1 min</div><h1>${esc(post.title)}</h1><div class="body-copy">${post.body.map(p => `<p>${esc(p)}</p>`).join('')}</div><button type="button" class="finish cursor-interaction" data-action="finish" data-id="${post.id}">${icon('circle-check')}Finish reading</button></article></main>`;
  }
  function render(model) {
    const active = document.activeElement;
    const focusedAttributes = active && model.element.contains(active) ? ['data-action','data-id','data-open','data-destination','data-source','data-filter'].filter(name => active.hasAttribute(name)).map(name => [name,active.getAttribute(name)]) : [];
    model.element.classList.toggle('is-reading',Boolean(model.open));
    model.element.innerHTML = `<header class="topbar">${model.design === 'fold' ? '<div class="brand">CARREL / YOUR READING ROOM</div>' : brand}${model.design !== 'fold' ? navigation(model) : ''}<div class="tools">${button('sidebar','panel-left','Show or hide sources · ⌘B',`aria-pressed="${model.sidebar}"`)}${button('refresh','refresh-cw','Refresh sources')}</div></header>
      <div class="workspace ${!model.sidebar ? 'no-sidebar' : ''}">${sources(model)}${model.open ? reader(model) : overview(model)}</div>
      <footer class="status"><span class="status-copy">${esc(model.message || 'Saved on this device')}</span><span>Preview</span></footer>`;
    if (globalThis.lucide) lucide.createIcons({attrs:{width:17,height:17}});
    model.element.style.setProperty('--title-size', `${model.titleSize}px`);
    if (focusedAttributes.length) {
      const selector = focusedAttributes.map(([name,value]) => `[${name}="${CSS.escape(value)}"]`).join('');
      const replacement = model.element.querySelector(selector) || (model.open ? model.element.querySelector('[data-action="back"]') : model.element.querySelector(`[data-open="${model.selected}"]`));
      replacement?.focus({preventScroll:true});
    }
  }
  function remember(model) {
    if (globalThis.openai?.setWidgetState) globalThis.openai.setWidgetState({modelContent:{design:model.design,destination:model.destination},privateContent:{sidebar:model.sidebar}}).catch(() => {});
  }
  const saved = globalThis.openai?.widgetState;
  root.querySelectorAll('[data-design]').forEach(element => {
    const model = { element, design: element.dataset.design, destination: 'Library', source: 'all', filter: 'All', query: '', sidebar: element.dataset.design !== 'field', open: null, selected: 'history', message: '', posts: posts.map(p => ({...p})), titleSize: element.dataset.design === 'field' ? 29 : 27 };
    models.set(model.design,model);
    if (saved?.modelContent?.design === model.design) {
      if (destinations.includes(saved.modelContent.destination)) model.destination = saved.modelContent.destination;
      if (typeof saved.privateContent?.sidebar === 'boolean') model.sidebar = saved.privateContent.sidebar;
    }
    render(model);
    element.addEventListener('input', event => {
      if (event.target.matches('input[type="search"]')) {
        model.query = event.target.value;
        element.querySelector('.items').innerHTML = list(model);
        if (globalThis.lucide) lucide.createIcons({attrs:{width:17,height:17}});
      }
    });
    element.addEventListener('click', event => {
      const control = event.target.closest('button');
      if (!control || !element.contains(control)) return;
      const action = control.dataset.action;
      if (control.dataset.destination) { model.destination = control.dataset.destination; model.source = 'all'; model.open = null; model.query = ''; model.filter = 'All'; }
      if (control.dataset.source) { model.source = control.dataset.source; model.destination = 'Library'; model.open = null; model.query = ''; }
      if (control.dataset.filter) model.filter = control.dataset.filter;
      if (control.dataset.open) { model.open = control.dataset.open; model.selected = model.open; model.posts.find(p => p.id === model.open).reading = true; }
      if (action === 'sidebar') model.sidebar = !model.sidebar;
      if (action === 'back') model.open = null;
      if (action === 'library') { model.destination = 'Library'; model.source = 'all'; model.filter = 'All'; model.query = ''; }
      if (action === 'read' || action === 'star') { const post = model.posts.find(p => p.id === control.dataset.id); if (action === 'read') post.read = !post.read; else post.starred = !post.starred; }
      if (action === 'finish') { const post = model.posts.find(p => p.id === control.dataset.id); post.read = true; post.reading = false; model.open = null; model.message = 'Marked read'; }
      if (action === 'refresh') model.message = 'Preview: sources are already up to date';
      if (action === 'older') model.message = 'Preview: this is the end of the sample archive';
      if (action === 'add') model.message = 'Preview: paste a website URL; discover its advertised feeds before subscribing';
      if (action === 'subscriptions') model.message = 'Preview: subscription settings and OPML import / export';
      if (action === 'devices') model.message = 'Preview: pair another device with a one-time invitation';
      render(model); remember(model);
    });
    element.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'b') { event.preventDefault(); model.sidebar = !model.sidebar; render(model); remember(model); }
      if (event.key === 'Escape' && model.open) { model.open = null; render(model); }
    });
    if (globalThis.Tweak) {
      const tweak = new Tweak({container:element,onChange:()=>render(model)});
      tweak.addSlider(model,'titleSize',{label:'Article title size',min:22,max:32,unit:'px'});
    }
  });
  window.addEventListener('openai:set_globals',event => {
    const snapshot = event.detail?.globals?.widgetState;
    const model = models.get(snapshot?.modelContent?.design);
    if (!model) return;
    if (destinations.includes(snapshot.modelContent.destination)) model.destination = snapshot.modelContent.destination;
    if (typeof snapshot.privateContent?.sidebar === 'boolean') model.sidebar = snapshot.privateContent.sidebar;
    render(model);
  });
})();
</script>
