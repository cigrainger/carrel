# Prefer permissive alternatives where a dependency offers a choice. Keep MPL
# obligations explicit; never accept GPL-2.0-only when Apache is available.
accepted = [
  "MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception", "MPL-2.0", "Unicode-3.0",
  "Zlib", "BSL-1.0", "CC0-1.0", "Unlicense", "CDLA-Permissive-2.0",
  "AGPL-3.0-or-later",
]
targets = [
  "aarch64-apple-darwin", "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu", "wasm32-unknown-unknown",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
