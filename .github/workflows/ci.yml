name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 4
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cargo_jobs: 4
          # The standard Apple Silicon runner has 7 GB of RAM.
          - os: macos-15
            cargo_jobs: 2
          - os: macos-15-intel
            cargo_jobs: 4

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Compile and lint webview
        run: cargo clippy -p carrel-app-frontend --target wasm32-unknown-unknown --no-default-features --features csr --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check Rustdoc
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags
        run: cargo doc --workspace --no-deps --locked

      - name: Pedantic review (advisory)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -W clippy::pedantic

  webview:
    name: Actual CSR build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      - name: Install recorded Trunk
        run: |
          if ! trunk --version 2>/dev/null | grep -q '0.21.14'; then
            cargo install trunk --version 0.21.14 --locked
          fi
      - name: Build actual client-side webview
        working-directory: crates/carrel-app
        env:
          NO_COLOR: 'true'
        run: trunk build --locked --config Trunk.toml --no-default-features --features csr

  documentation:
    name: Docs and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docs
      - run: mdbook build site
      - run: python3 scripts/check_docs.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  licenses:
    name: Dependency license notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.95.0
      - name: Install recorded license tool
        run: |
          mkdir -p "$RUNNER_TEMP/license-tool"
          curl --fail --location --retry 3 \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/cargo-about.tar.gz"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-about.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/license-tool"
          echo "$RUNNER_TEMP/license-tool" >> "$GITHUB_PATH"
      - run: python3 scripts/build_frontend.py --notices-only
