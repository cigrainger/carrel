name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build as a draft prerelease
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  CARGO_TERM_COLOR: always
  NO_COLOR: 'true'
  RUST_TEST_THREADS: '2'

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py validate "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Package / ${{ matrix.platform }}
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cargo_jobs: 2
            platform: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            cargo_jobs: 4
            platform: macos-x86_64
            bundles: dmg
          - os: ubuntu-24.04
            cargo_jobs: 4
            platform: linux-x86_64
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      - name: Install recorded desktop tools
        shell: bash
        run: |
          if ! trunk --version 2>/dev/null | grep -q '0.21.14'; then
            cargo install trunk --version 0.21.14 --locked
          fi
          if ! cargo tauri --version 2>/dev/null | grep -q '2.10.0'; then
            cargo install tauri-cli --version 2.10.0 --locked
          fi
          if ! cargo about --version 2>/dev/null | grep -q '0.9.2'; then
            cargo install cargo-about --version 0.9.2 --locked --features cli
          fi
      - name: Build release packages
        working-directory: crates/carrel-app
        env:
          BUNDLES: ${{ matrix.bundles }}
          # Draft only. Developer ID signing/notarization happens locally before publication.
          APPLE_SIGNING_IDENTITY: '-'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo tauri build --verbose --bundles "$BUNDLES" -- --locked
      - name: Verify engine and native regressions in release mode
        run: cargo test --workspace --release --locked
      - name: Normalize artifact names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/release.py package "$PLATFORM" target/release/bundle "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble draft prerelease
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/packages
      - name: Require complete matrix and checksum packages plus matching source
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          python3 scripts/release.py assemble "$RELEASE_TAG" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/release"
          python3 scripts/release.py notes "$RELEASE_TAG" "$RUNNER_TEMP/notes.md"
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r["isDraft"] else "Refusing to overwrite a published release")' "$RUNNER_TEMP/existing-release.json"
            gh release edit "$RELEASE_TAG" --draft --prerelease --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Carrel $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --clobber
