[workspace]
members = [
    "crates/carrel-app",
    "crates/carrel-app/frontend",
    "crates/carrel-cli",
    "crates/carrel-core",
    "crates/carrel-feeds",
    "crates/carrel-store",
    "crates/carrel-sync",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
ammonia = "4.1.2"
anyhow = "1"
argon2 = "0.5"
blake3 = "1"
bytes = "1"
carrel-core = { path = "crates/carrel-core" }
carrel-feeds = { path = "crates/carrel-feeds" }
carrel-store = { path = "crates/carrel-store" }
carrel-sync = { path = "crates/carrel-sync" }
chacha20poly1305 = "0.10"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
cozo = { version = "0.7.6", default-features = false, features = ["rayon", "storage-rocksdb"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
feed-rs = "2.3.1"
hex = "0.4"
html-escape = "0.2"
httpdate = "1"
kuchiki = "0.8.1"
leptos = { version = "0.8.19", default-features = false }
leptos_router = { version = "0.8.13", default-features = false }
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
readable-readability = "0.4.0"
reqwest = { version = "0.13.3", default-features = false, features = ["brotli", "charset", "deflate", "gzip", "http2", "rustls", "system-proxy", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
tauri = "2.11.0"
tauri-build = "2.6.0"
tempfile = "3"
texting_robots = "0.2.2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Storage", "Window"] }
wiremock = "0.6.5"
zeroize = "1"
