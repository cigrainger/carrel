[workspace]
members = [
    "crates/carrel-app",
    "crates/carrel-app/frontend",
    "crates/carrel-cli",
    "crates/carrel-core",
    "crates/carrel-feeds",
    "crates/carrel-store",
    "crates/carrel-sync",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
ammonia = "4.2.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
blake3 = "1.8.7"
bytes = "1.12.1"
carrel-core = { path = "crates/carrel-core" }
carrel-feeds = { path = "crates/carrel-feeds" }
carrel-store = { path = "crates/carrel-store" }
carrel-sync = { path = "crates/carrel-sync" }
chacha20poly1305 = "0.11.0"
ciborium = "0.2"
clap = { version = "4.6.7", features = ["derive"] }
cozo = { version = "0.7.6", default-features = false, features = ["rayon", "storage-rocksdb"] }
ed25519-dalek = "3.0.0"
feed-rs = "3.0.0"
futures-core = "0.3.34"
getrandom = "0.4.3"
hex = "0.4"
html-escape = "0.2.15"
httpdate = "1"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath", "portmapper"] }
iroh-blobs = { version = "0.103.1", default-features = false, features = ["fs-store"] }
iroh-docs = { version = "0.101.0", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "0.101.0", default-features = false, features = ["net"] }
kuchiki = "0.8.1"
katex = "0.4.6"
leptos = { version = "0.8.22", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
proptest = "1.11.0"
quick-xml = "0.42.0"
readable-readability = "0.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["brotli", "charset", "deflate", "gzip", "http2", "rustls", "system-proxy", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.151"
tauri = "2.12.2"
tauri-build = "2.7.1"
tempfile = "3.27.0"
texting_robots = "0.2.2"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Document", "DocumentFragment", "DomRect", "Element", "FocusOptions", "HtmlButtonElement", "HtmlDialogElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "MouseEvent", "Node", "NodeList", "Range", "Selection", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Storage", "Window", "console"] }
wiremock = "0.6.5"
zeroize = "1.9.1"

# Keep normal desktop builds practical on disk while retaining useful backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# Opt in when inspecting variables or stepping through dependencies.
[profile.debugging]
inherits = "dev"
debug = true
incremental = true

[profile.debugging.package."*"]
debug = true
